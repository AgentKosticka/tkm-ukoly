# Úkolníček ITV a TKM Litoměřice
#
#   cp .env.example .env      (a upravit podle potřeby)
#   docker compose up -d --build
#
# Tři služby: aplikace, vstupní brána Caddy (HTTPS) a aktualizační služba,
# která hlídá repozitář, ze kterého byl projekt naklonován.

# Pevné jméno projektu: aktualizační služba volá Compose z jiné cesty a bez
# něj by si založila vlastní kopii služeb.
name: tkm-ukoly

services:
  app:
    build:
      context: .
      target: runtime
    image: tkm-ukoly-app
    restart: unless-stopped
    init: true
    environment:
      # Hlavičkám X-Forwarded-* se věří jen z vnitřní sítě, kde je kromě
      # aplikace už jen Caddy.
      TRUST_PROXY: ${PROXY_SUBNET:-172.30.99.0/29}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JXL_MAX_MEGAPIXELS: ${JXL_MAX_MEGAPIXELS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Vlastní složka pro fotky (PHOTOS_DIR v .env) je v kontejneru připojená
      # jako /photos. Bez ní zůstávají fotky ve svazku data, v /data/photos.
      PHOTOS_DIR: ${PHOTOS_DIR:+/photos}
      PHOTOS_HOST_DIR: ${PHOTOS_DIR:-}
    volumes:
      - data:/data
      # Když PHOTOS_DIR chybí, připojí se sem podruhé svazek data a aplikace
      # toto místo nepoužije. Compose totiž neumí připojení podmíněně vynechat.
      - ${PHOTOS_DIR:-data}:/photos
    networks:
      - proxy
    # Aplikace nemá žádný port vystavený ven; dostane se k ní jen Caddy.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s

  caddy:
    build: ./deploy/caddy
    image: tkm-ukoly-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
      - outside
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Jednou za UPDATE_INTERVAL sekund zjistí, jestli v původním repozitáři
  # přibyly změny. Pokud ano, stáhne je, sestaví nové obrazy, nasadí je a
  # ověří, že aplikace běží; jinak se vrátí k předchozí verzi.
  #
  # Pozor: služba má přístup k Dockeru na hostiteli, což je totéž jako práva
  # správce stroje. Kdo může zapisovat do repozitáře, ovládá i server.
  # Vypnutí: UPDATE_INTERVAL=0 v .env.
  updater:
    build: ./deploy/updater
    image: tkm-ukoly-updater
    restart: unless-stopped
    init: true
    environment:
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - updater_state:/state
    networks:
      - outside
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  caddy_data:
  caddy_config:
  updater_state:

networks:
  # Vnitřní síť bez přístupu ven; jsou v ní jen aplikace a Caddy.
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.99.0/29}
  outside: {}
