name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy v běhovém obrazu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cíl "test" sestaví běhový obraz a pustí v něm celou sadu testů,
      # včetně skutečných nástrojů JPEG XL z Debianu.
      - run: docker build --target test .

  aktualizace:
    name: Aktualizační skript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox dash
      - run: SH=dash sh deploy/updater/test.sh
      - run: SH="busybox sh" sh deploy/updater/test.sh

  nasazeni:
    name: Zkušební nasazení přes Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Připravit .env
        run: |
          cp .env.example .env
          echo "ADMIN_PASSWORD=Zkusebni-Heslo-Pro-CI-2026" >> .env
          echo "UPDATE_INTERVAL=0" >> .env
      - name: Ověřit konfiguraci
        run: docker compose config --quiet
      - name: Spustit a počkat na zdravé služby
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Aplikace odpovídá přes Caddy
        run: |
          set -eu
          curl -fsS http://localhost/api/health | grep -q '"ok":true'
          curl -fsS http://localhost/ | grep -q 'Úkolníček'
          curl -fsSI http://localhost/ | grep -qi "content-security-policy: default-src 'none'"
          curl -fsS http://localhost/api/tasks | grep -q '"counts"'
          # Soubory pro instalaci jako aplikace.
          curl -fsSI http://localhost/manifest.webmanifest | grep -qi 'content-type: application/manifest+json'
          curl -fsS http://localhost/sw.js | grep -q "addEventListener('fetch'"
      - name: V obrazu běží produkční fáze s funkčním JPEG XL
        run: |
          set -eu
          docker compose logs app | grep -q 'JPEG XL: cjxl'
          # Testy do provozního obrazu nepatří.
          docker compose exec -T app sh -c 'test ! -e /app/test'
      - name: Zápis bez přihlášení je odmítnut
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/tasks \
            -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' -d '{"title":"x"}')
          test "$code" = 401
      - name: Přihlášení správce a nahrání fotky
        run: |
          set -eu
          jar=$(mktemp)
          # Hlavička Origin jako z prohlížeče: ověří, že aplikace za Caddy
          # správně pozná vlastní adresu.
          curl -fsS -c "$jar" -X POST http://localhost/api/auth/login \
            -H 'Origin: http://localhost' \
            -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"username":"admin","password":"Zkusebni-Heslo-Pro-CI-2026"}' | grep -q '"role":"admin"'
          id=$(curl -fsS -b "$jar" -X POST http://localhost/api/tasks \
            -H 'Origin: http://localhost' \
            -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"title":"Zkouška z CI"}' | sed -E 's/.*"task":\{"id":([0-9]+).*/\1/')
          photo=$(curl -fsS -b "$jar" -X POST "http://localhost/api/tasks/$id/photos" \
            -H 'Origin: http://localhost' -H 'X-Requested-With: ukolnicek' \
            -F 'photo=@public/icon-512.png;type=image/png' | sed -E 's/.*"photo":\{"id":"([A-Za-z0-9_-]+)".*/\1/')
          curl -fsS -o /dev/null "http://localhost/media/$photo/thumb"
          docker compose exec -T app sh -c 'ls /data/photos/*/ | grep -q "\.orig\."'
      - name: Aplikace běží bez práv roota a není dostupná mimo Caddy
        run: |
          set -eu
          uid=$(docker compose exec -T app id -u)
          echo "uid aplikace: $uid"
          test "$uid" != 0
          # Kontejner aplikace nesmí mít žádný port zveřejněný na hostiteli...
          ports=$(docker inspect "$(docker compose ps -q app)" --format '{{json .NetworkSettings.Ports}}')
          echo "porty aplikace: $ports"
          if echo "$ports" | grep -q HostPort; then exit 1; fi
          # ...a z hostitele se na něj nejde připojit přímo.
          if curl -s --max-time 3 -o /dev/null http://localhost:3000/api/health; then exit 1; fi
      - name: Přes HTTPS dostane cookie příznak Secure a cizí původ neprojde
        run: |
          set -eu
          # Pro adresu "localhost" si Caddy vystaví vlastní certifikát.
          sed -i 's/^SITE_ADDRESS=.*/SITE_ADDRESS=localhost/' .env
          docker compose up -d --wait --wait-timeout 120 caddy
          login() {
            curl -ksS -D - -o /dev/null -X POST https://localhost/api/auth/login \
              -H "Origin: $1" -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
              -d '{"username":"admin","password":"Zkusebni-Heslo-Pro-CI-2026"}'
          }
          ok=$(login https://localhost)
          echo "$ok" | head -n 1 | grep -q ' 200'
          echo "$ok" | grep -i '^set-cookie: __Host-sid=' | grep -qi 'secure'
          echo "$ok" | grep -i '^set-cookie: __Host-sid=' | grep -qi 'httponly'
          echo "$ok" | grep -i '^set-cookie: __Host-sid=' | grep -qi 'samesite=strict'
          echo "$ok" | grep -qi '^strict-transport-security:'
          login https://evil.example | head -n 1 | grep -q ' 403'
          # Cookie bez prefixu __Host- se přes HTTPS nepřijme.
          curl -ksS https://localhost/api/me -H 'Cookie: sid=podvrh' | grep -q '"user":null'
      - name: Logy při selhání
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Úklid
        if: always()
        run: docker compose down -v

  tunel:
    name: Zkušební nasazení za tunelem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Připravit .env
        run: |
          cp .env.example .env
          echo "COMPOSE_FILE=compose.yml:compose.tunnel.yml" >> .env
          echo "TUNNEL_PORT=8123" >> .env
          echo "ADMIN_PASSWORD=Zkusebni-Heslo-Pro-CI-2026" >> .env
          echo "UPDATE_INTERVAL=0" >> .env
          # Fotky mimo svazek s daty, ve složce na hostiteli.
          sudo mkdir -p /srv/ukoly-fotky
          sudo chown 1000:1000 /srv/ukoly-fotky
          echo "PHOTOS_DIR=/srv/ukoly-fotky" >> .env
      - name: Ověřit konfiguraci
        run: |
          set -eu
          docker compose config --format json > merged.json
          # Seznam portů se musí nahradit, ne rozšířit.
          jq -e '
            .services.caddy.ports
            | length == 1 and .[0].host_ip == "127.0.0.1" and (.[0].published | tostring) == "8123" and .[0].target == 80' merged.json
      - name: Spustit a počkat na zdravé služby
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Aktualizační služba vidí stejnou sestavu
        run: |
          set -eu
          # update.sh volá Compose z obrazu aktualizační služby nad složkou
          # /repo. Kdyby tam COMPOSE_FILE z .env neplatil, příští aktualizace
          # by Caddy vrátila na porty 80 a 443.
          docker run --rm -v "$PWD":/repo tkm-ukoly-updater \
            docker compose --project-directory /repo config --format json > updater.json
          jq -e '
            (.services.caddy.ports
              | length == 1 and .[0].host_ip == "127.0.0.1" and (.[0].published | tostring) == "8123" and .[0].target == 80)
            and (.services.caddy.command | index("/etc/caddy/Caddyfile.tunnel") != null)
            and (.services.app.environment.TRUST_PROXY_HOPS | tostring) == "2"' updater.json
      - name: Vystavený je jediný port a jen na místní smyčce
        run: |
          set -eu
          ports=$(docker inspect "$(docker compose ps -q caddy)" --format '{{json .NetworkSettings.Ports}}')
          echo "porty Caddy: $ports"
          echo "$ports" | jq -e '[.[] | select(. != null) | .[]] == [{"HostIp":"127.0.0.1","HostPort":"8123"}]'
          curl -fsS http://127.0.0.1:8123/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8123/ | grep -q 'Úkolníček'
          # Přes síťovou adresu stroje se na port nejde připojit.
          ip=$(hostname -I | awk '{print $1}')
          echo "adresa stroje: $ip"
          if curl -s --max-time 3 -o /dev/null "http://$ip:8123/api/health"; then exit 1; fi
      - name: Hlavičky od tunelu určují protokol i adresu klienta
        run: |
          set -eu
          # Požadavek tak, jak ho předává tunel: veřejné jméno v Host, protokol
          # v X-Forwarded-Proto a adresa návštěvníka na konci X-Forwarded-For.
          login() {
            curl -sS -D - -o /dev/null -X POST http://127.0.0.1:8123/api/auth/login \
              -H 'Host: ukoly.example.cz' -H 'X-Forwarded-Proto: https' -H "X-Forwarded-For: $1" \
              -H "Origin: $2" -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
              -d "{\"username\":\"admin\",\"password\":\"$3\"}"
          }
          ok=$(login 203.0.113.1 https://ukoly.example.cz Zkusebni-Heslo-Pro-CI-2026)
          echo "$ok" | head -n 1 | grep -q ' 200'
          echo "$ok" | grep -i '^set-cookie: __Host-sid=' | grep -qi 'secure'
          echo "$ok" | grep -qi '^strict-transport-security:'
          login 203.0.113.1 http://ukoly.example.cz Zkusebni-Heslo-Pro-CI-2026 | head -n 1 | grep -q ' 403'
          login 203.0.113.1 https://evil.example Zkusebni-Heslo-Pro-CI-2026 | head -n 1 | grep -q ' 403'
          # Brzda na hádání hesel se řídí položkou od tunelu; co si před ni
          # připsal návštěvník sám, nehraje roli.
          for i in 1 2 3 4 5; do
            login "10.0.0.$i, 203.0.113.7" https://ukoly.example.cz spatne-heslo-123 | head -n 1 | grep -q ' 401'
          done
          login '1.2.3.4, 203.0.113.7' https://ukoly.example.cz Zkusebni-Heslo-Pro-CI-2026 | head -n 1 | grep -q ' 429'
          login '203.0.113.7, 203.0.113.8' https://ukoly.example.cz Zkusebni-Heslo-Pro-CI-2026 | head -n 1 | grep -q ' 200'
      - name: Bez hlaviček od tunelu běží web přes obyčejné HTTP
        run: |
          set -eu
          out=$(curl -sS -D - -o /dev/null -X POST http://127.0.0.1:8123/api/auth/login \
            -H 'Origin: http://127.0.0.1:8123' -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"username":"admin","password":"Zkusebni-Heslo-Pro-CI-2026"}')
          echo "$out" | head -n 1 | grep -q ' 200'
          echo "$out" | grep -qi '^set-cookie: sid='
          if echo "$out" | grep -qi '^strict-transport-security:'; then exit 1; fi
      - name: Fotky se ukládají do složky z PHOTOS_DIR
        run: |
          set -eu
          docker compose logs app | grep -q 'Fotky se ukládají do složky /srv/ukoly-fotky'
          jar=$(mktemp)
          base=http://127.0.0.1:8123
          curl -fsS -c "$jar" -X POST $base/api/auth/login \
            -H "Origin: $base" -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"username":"admin","password":"Zkusebni-Heslo-Pro-CI-2026"}' | grep -q '"role":"admin"'
          id=$(curl -fsS -b "$jar" -X POST $base/api/tasks \
            -H "Origin: $base" -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"title":"Fotka na jiném disku"}' | sed -E 's/.*"task":\{"id":([0-9]+).*/\1/')
          # Velká fotka: její archiv v JPEG XL vzniká v dočasné složce u dat
          # a do složky fotek se přesouvá přes hranici dvou připojení.
          docker compose exec -T app node --input-type=module -e '
            import sharp from "sharp";
            const w = 2400, h = 1800, raw = Buffer.alloc(w * h * 3);
            let seed = 987654321;
            for (let i = 0; i < raw.length; i += 1) {
              seed = (Math.imul(seed, 1103515245) + 12345) & 0x7fffffff;
              raw[i] = (Math.floor(((Math.floor(i / 3) % w) / w) * 200) + (seed % 40)) & 0xff;
            }
            process.stdout.write(await sharp(raw, { raw: { width: w, height: h, channels: 3 } }).jpeg({ quality: 85 }).toBuffer());
          ' > velka.jpg
          ls -l velka.jpg
          photo=$(curl -fsS -b "$jar" -X POST "$base/api/tasks/$id/photos" \
            -H "Origin: $base" -H 'X-Requested-With: ukolnicek' \
            -F 'photo=@velka.jpg;type=image/jpeg' | sed -E 's/.*"photo":\{"id":"([A-Za-z0-9_-]+)".*/\1/')
          echo "fotka: $photo"
          sudo find /srv/ukoly-fotky -type f -printf '%u:%g %s %P\n'
          sudo find /srv/ukoly-fotky -type f -name "$photo.orig.jxl" | grep -q .
          sudo find /srv/ukoly-fotky -type f -name "$photo.view.webp" | grep -q .
          sudo find /srv/ukoly-fotky -type f -name "$photo.thumb.webp" | grep -q .
          # Ve svazku s daty žádná fotka není.
          docker compose exec -T app sh -c 'test -z "$(find /data/photos -type f 2>/dev/null)"'
          curl -fsS -o /dev/null "$base/media/$photo/thumb"
          curl -fsS -o /dev/null "$base/media/$photo/view"
          # Originál se z archivu v JPEG XL rozbalí zpátky na JPEG.
          curl -fsS -b "$jar" -D original.txt -o original.jpg "$base/api/photos/$photo/original"
          grep -qi '^content-type: image/jpeg' original.txt
          test "$(head -c 2 original.jpg | od -An -tx1 | tr -d ' ')" = ffd8
      - name: Úložiště připojené až po startu (síťový disk) aplikace uvidí bez restartu
        run: |
          set -eu
          # Místní složka existuje vždy; „disk“ se do ní připojí až za běhu.
          sudo mkdir -p /srv/ukoly-uloziste/disk
          sed -i 's#^PHOTOS_DIR=.*#PHOTOS_DIR=/srv/ukoly-uloziste#' .env
          echo "PHOTOS_SUBDIR=disk/fotky" >> .env
          docker compose up -d --wait --wait-timeout 180
          docker compose logs app | grep -q 'úložiště není připojené'
          docker inspect "$(docker compose ps -q app)" --format '{{range .Mounts}}{{.Destination}} {{.Propagation}}{{"\n"}}{{end}}' | grep -q '^/photos rslave'
          jar=$(mktemp)
          base=http://127.0.0.1:8123
          curl -fsS -c "$jar" -X POST $base/api/auth/login \
            -H "Origin: $base" -H 'Content-Type: application/json' -H 'X-Requested-With: ukolnicek' \
            -d '{"username":"admin","password":"Zkusebni-Heslo-Pro-CI-2026"}' | grep -q '"role":"admin"'
          upload() {
            curl -sS -b "$jar" -o upload.json -w '%{http_code}' -X POST "$base/api/tasks/1/photos" \
              -H "Origin: $base" -H 'X-Requested-With: ukolnicek' -F 'photo=@velka.jpg;type=image/jpeg'
          }
          # Bez připojeného disku se nahrání odmítne a na místní disk se nic nezapíše.
          test "$(upload)" = 503
          grep -q '"storage_unavailable"' upload.json
          curl -fsS $base/api/tasks | grep -q '"counts"'
          test -z "$(sudo find /srv/ukoly-uloziste -type f)"
          # Připojení za běhu: aplikace disk po zkušebním intervalu najde sama.
          sudo mount -t tmpfs -o uid=1000,gid=1000,mode=0700 tmpfs /srv/ukoly-uloziste/disk
          code=000
          for attempt in $(seq 1 20); do
            code=$(upload)
            if [ "$code" = 201 ]; then break; fi
            sleep 5
          done
          echo "nahrání po připojení: $code (pokus $attempt)"
          test "$code" = 201
          photo=$(sed -E 's/.*"photo":\{"id":"([A-Za-z0-9_-]+)".*/\1/' upload.json)
          sudo find /srv/ukoly-uloziste/disk/fotky -type f -name "$photo.orig.jxl" | grep -q .
          curl -fsS -o /dev/null "$base/media/$photo/thumb"
          # Po odpojení na místním disku nic nezůstane: vše šlo na připojený disk.
          sudo umount -l /srv/ukoly-uloziste/disk
          test -z "$(sudo find /srv/ukoly-uloziste -type f)"
      - name: Tunel v kontejneru dosáhne na Caddy přes síť outside
        run: |
          set -eu
          # HSTS se posílá jen tehdy, když aplikace převzala protokol https.
          docker run --rm --network tkm-ukoly_outside --entrypoint wget tkm-ukoly-caddy \
            -S -O /dev/null --header 'X-Forwarded-Proto: https' --header 'X-Forwarded-For: 203.0.113.1' \
            http://caddy:80/api/health 2>&1 | tee wget.txt
          grep -qi 'strict-transport-security' wget.txt
      - name: Aplikace není dostupná mimo Caddy
        run: |
          set -eu
          ports=$(docker inspect "$(docker compose ps -q app)" --format '{{json .NetworkSettings.Ports}}')
          echo "porty aplikace: $ports"
          if echo "$ports" | grep -q HostPort; then exit 1; fi
          if curl -s --max-time 3 -o /dev/null http://localhost:3000/api/health; then exit 1; fi
      - name: Logy při selhání
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Úklid
        if: always()
        run: docker compose down -v
